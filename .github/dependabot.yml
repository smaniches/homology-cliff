# Routine Dependabot version-update PRs are disabled for both ecosystems.
# Security updates remain eligible when Dependabot alerts and security updates
# are enabled in GitHub repository settings. Keep scientific lockfiles stable;
# perform other dependency upgrades in deliberate, separately reviewed batches.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
    groups:
      verification-toolchain:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
