name: Exploratory ESM-2 t33 actual-model pilot

on:
  pull_request:
    paths:
      - experiments/esm2_t33_pilot_20261102/**
      - .github/workflows/esm2-t33-pilot-exploratory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-t33-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      PILOT_OUTPUT_DIR: pilot-out
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify original frozen sequences
        shell: bash
        run: |
          git lfs pull --include="data/sequences/proteins_25k_sequences.json" --exclude=""
          printf '%s  %s\n' \
            c99d8329c02b806b9d208465946c68826d17245cd9e012ca9a7b94faea0a60fc \
            data/sequences/proteins_25k_sequences.json | sha256sum --check --strict
      - name: Install fixed CPU runtime from wheels
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --only-binary=:all: 'numpy==2.1.3' 'transformers==4.46.3' 'huggingface-hub==0.36.0' 'safetensors==0.4.5'
          python -m pip check
      - name: Check pooling and output safety independently of model weights
        run: python -m unittest discover -s experiments/esm2_t33_pilot_20261102 -p 'test_*.py' -v
      - name: Execute real ESM-2 t33 inference
        run: python -u experiments/esm2_t33_pilot_20261102/run_t33_pilot.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: esm2-t33-pilot-evidence
          path: pilot-out/
          retention-days: 30
          if-no-files-found: ignore
