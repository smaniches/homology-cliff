name: manifest-refresh-once

on:
  push:
    branches:
      - fix/10seed-runner-preflight-audit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: restore verifier and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/manifest.yml > .github/workflows/manifest.yml
          python scripts/update_manifest.py
          python scripts/update_manifest.py --check
          git diff --check

      - name: commit canonical manifest refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/manifest.yml MANIFEST.sha256.json
          git diff --cached --check
          git commit -m "Refresh manifest after 10-seed runner repair"
          git push origin HEAD:${GITHUB_REF_NAME}
