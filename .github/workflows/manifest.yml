name: manifest-verify
# Verifies MANIFEST.sha256.json against disk content for every real
# (non-LFS-stub) tracked file, AND verifies all committed pre-registration
# SHA256 locks: the two published/paper-cited locks plus the forward-looking
# CI-only cross-family 10-seed lock. Both checks are implemented as standalone
# scripts in scripts/ci/ so they are runnable locally with the exact same logic
# CI uses.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {lfs: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: '3.11'}

      - name: verify manifest hashes against disk
        run: python scripts/ci/verify_manifest.py

      - name: verify pre-registration SHA256 locks
        run: python scripts/ci/verify_prereg_locks.py
