name: audit-manifest-refresh-temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh:
    if: github.head_ref == 'audit/evidence-integrity-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Regenerate manifest for audit branch
        run: python scripts/update_manifest.py
      - name: Exclude this temporary workflow from final manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('MANIFEST.sha256.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.pop('.github/workflows/_audit_manifest_refresh.yml', None)
          with path.open('w', encoding='utf-8', newline='\n') as handle:
              json.dump(data, handle, indent=1, sort_keys=True)
              handle.write('\n')
          PY
      - name: Verify generated manifest
        run: |
          # The temporary workflow is intentionally excluded from the candidate
          # manifest, so remove it before running the repository verifier.
          rm .github/workflows/_audit_manifest_refresh.yml
          python scripts/ci/verify_manifest.py
      - name: Upload candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-manifest-candidate
          path: MANIFEST.sha256.json
          if-no-files-found: error
          retention-days: 1
