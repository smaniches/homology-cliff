name: lint
# Static quality gates: ruff (lint), mypy (strict types on the verifier
# surface), bandit (security, baseline-gated), and pip-audit (dependency CVEs).
# All run on the LFS-free, dependency-light verification toolchain pinned in
# requirements-lock.txt -- no torch/faiss and no Git-LFS payload required.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {lfs: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: '3.11', cache: 'pip'}

      - name: install verification toolchain (pinned)
        run: pip install --quiet -r requirements-lock.txt

      - name: ruff (lint -- pyflakes + syntax errors)
        run: ruff check .

      - name: mypy (--strict on scripts/ci, configured in pyproject.toml)
        run: mypy

      - name: bandit (security; intentional checks skipped via pyproject [tool.bandit])
        run: bandit -c pyproject.toml -r code/harnesses code/analyses scripts deployment_example

      - name: pip-audit (CVEs in the CI verification toolchain)
        run: pip-audit -r requirements-lock.txt
