name: tests
# Schema and invariant tests on committed cells. Runs without LFS payload
# on free open-source allowance; data-dependent tests skip cleanly when
# files are LFS pointer stubs (see tests/test_cell_schema.py for the
# graceful-skip logic). To execute the full suite, on a fresh clone:
#     git lfs pull
#     pytest tests/ -v

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}

      - name: install pinned verification toolchain
        # requirements-lock.txt pins the LFS-free test/lint stack (numpy, pytest,
        # pytest-cov, coverage, ...). No torch/faiss/LFS payload is needed.
        run: pip install --quiet -r requirements-lock.txt

      - name: pytest with coverage + skip-summary
        # -rs prints the skip reasons in the summary so reviewers see exactly
        # which tests are data-dependent and why they skipped. --cov enforces
        # the honest coverage floor configured in pyproject.toml (fail_under).
        run: pytest tests/ -v --tb=short -rs --cov --cov-report=term-missing
