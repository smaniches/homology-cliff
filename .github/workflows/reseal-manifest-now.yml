name: One-time manifest reseal

on:
  push:
    branches: [dependabot/pip/verification-toolchain-0178a807eb]

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Reseal with the repository generator and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reseal-manifest-now.yml
          python scripts/update_manifest.py
          python scripts/ci/verify_manifest.py
          git add MANIFEST.sha256.json
          git commit -m "chore: reseal manifest for dependency refresh"
          git push origin HEAD:dependabot/pip/verification-toolchain-0178a807eb
