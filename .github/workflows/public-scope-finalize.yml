name: Finalize calibrated public claims
on:
  push:
    branches: [fix/public-claim-scope-20261023]
    paths: [.github/workflows/public-scope-finalize.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/public-claim-scope-20261023
      - name: Bind public wording to recorded evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('README.md'); text=p.read_text()
          old='and show it is not a stratification artifact via a matching 3,000-cell full-pool permutation null.'
          assert old in text
          text=text.replace(old,'and compare it with a matching 3,000-cell full-pool permutation null that does not reproduce the measured gap. This control does not exclude every sampling or measurement artifact.')
          p.write_text(text)
          p=Path('docs/index.html'); text=p.read_text()
          changes={
              'The study was designed to answer that before it was run.':'The archived controls address specific alternatives; public history does not establish original registration-before-execution.',
              'The cliff is therefore not produced by the stratification itself.':'The tested permutation null does not reproduce the measured gap; it does not exclude every sampling or measurement artifact.',
              'A controlled demonstration that the effect is <b>not a stratification artifact</b> (full-pool permutation null).':'A controlled comparison with a <b>full-pool permutation null</b> that does not reproduce the observed gap.',
              'A <b>candidate rescue</b> and an explicit deployment recommendation.':'A <b>candidate intervention</b> requiring independent validation before operational use.',
              'Every claim traces to a committed artifact.':'Archived computations can be checked against committed artifacts, subject to the explicit erratum and curation limitations.',
              'distant high-confidence positive-prediction precision = 0.068':'distant positive-prediction precision across all positive calls = 0.068',
              'in the highest-confidence distant bin the positive-prediction precision is 3 of 44.':'across all 44 distant positive calls, 3 are correct. In the highest-confidence bin, 0 of 3 are correct; this tiny bin does not support a precise population estimate.',
              'on a 24,885-protein test set.':'from a 24,885-protein source pool; query-set size depends on the held-out panel.',
              'The rescue, and the deployment recommendation':'The candidate intervention and validation boundary',
              'The honest operational consequence: apply the projection, and <b>even then route every distant-stratum positive to human review.</b> The rescue narrows the gap; it does not make the distant stratum trustworthy on its own.':'The projection is a research candidate, not a validated screening control. Independent-cohort testing, calibration, and a deployment-specific safety assessment are prerequisites for operational use; human review alone does not establish validity.',
              '<h2>Adopting the rescue</h2>':'<h2>Evaluating the candidate intervention</h2>',
              'If you operate a frozen-PLM screen, the actionable result is small and self-contained: fit the panel-only projection on your own panel, apply it before retrieval, and route distant-stratum positives to human review. A minimal, dependency-light reference implementation and the deployment scope are committed:':'For independent research evaluation, a minimal reference implementation and model card are available. The archived result is not sufficient to recommend operational adoption; evaluation must keep training, calibration, and external testing separate:',
              'the learned panel-only projection as a drop-in rescue.':'the learned panel-only projection as a research reference implementation.',
          }
          for old,new in changes.items():
              assert old in text,old
              text=text.replace(old,new)
          p.write_text(text)
          p=Path('tests/test_public_claim_scope.py'); text=p.read_text()
          text+='''\n\ndef test_website_distinguishes_positive_precision_from_top_bin():\n    import json\n    data = json.loads((ROOT / "data/results_summaries/calibration_results.json").read_text())\n    distant = data["distant"]\n    assert distant["positive_prediction"]["n_predicted_positive"] == 44\n    assert distant["positive_prediction"]["tp"] == 3\n    top = distant["reliability"][-1]\n    assert top["n"] == 3 and top["mean_obs"] == 0\n    text = (ROOT / "docs/index.html").read_text()\n    assert "across all 44 distant positive calls, 3 are correct" in text\n    assert "In the highest-confidence bin, 0 of 3 are correct" in text\n    assert "drop-in rescue" not in text\n'''
          p.write_text(text)
          path=Path('MANIFEST.sha256.json'); data=json.loads(path.read_text()); old=dict(data)
          edited=['README.md','docs/index.html','tests/test_public_claim_scope.py']
          for rel in edited:
              binary=Path(rel).read_bytes(); data[rel]={'bytes':len(binary),'sha256':hashlib.sha256(binary).hexdigest()}
          assert all(data[k]==v for k,v in old.items() if k not in edited)
          path.write_text(json.dumps(data,sort_keys=True,indent=1)+'\n')
          PY
          python3 scripts/ci/verify_manifest.py
          git add README.md docs/index.html tests/test_public_claim_scope.py MANIFEST.sha256.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'docs: correct calibration bins and require external validation before adoption'
          git push origin HEAD:fix/public-claim-scope-20261023
