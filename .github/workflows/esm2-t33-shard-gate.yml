name: ESM-2 t33 shard extraction gate

on:
  pull_request:
    paths:
      - experiments/esm2_t33_full_20261102/**
      - .github/workflows/esm2-t33-shard-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install NumPy wheel
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.1.3'
      - name: Unit tests for extraction, resume and whole-matrix assembly
        run: python -m unittest discover -s experiments/esm2_t33_full_20261102 -p 'test_*.py' -v

  pretrained-anchor:
    needs: shard-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download only original frozen sequences and check SHA-256
        shell: bash
        run: |
          git lfs pull --include="data/sequences/proteins_25k_sequences.json" --exclude=""
          printf '%s  %s\n' \
            c99d8329c02b806b9d208465946c68826d17245cd9e012ca9a7b94faea0a60fc \
            data/sequences/proteins_25k_sequences.json | sha256sum --check --strict
      - name: Install pinned binary inference runtime
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --only-binary=:all: 'numpy==2.1.3' 'transformers==4.46.3' 'huggingface-hub==0.36.0' 'safetensors==0.4.5'
          python -m pip check
      - name: Run real-model extraction covering previously verified anchor
        run: |
          python -u experiments/esm2_t33_full_20261102/run_full_extraction.py shard \
            --start 4668 --end 4692 --block-size 16 --outdir shard-smoke
      - name: Verify restart behavior without loading model a second time
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'experiments/esm2_t33_full_20261102')
          from run_full_extraction import verify_block
          for path in sorted(Path('shard-smoke').glob('part_*.json')):
              info, x = verify_block(path, expected_device='cpu')
              print('CHECKED',info['start'],info['end'],info['npy_sha256'],x.shape)
          assert len(list(Path('shard-smoke').glob('part_*.json'))) == 2
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: esm2-t33-shard-smoke
          path: shard-smoke/
          if-no-files-found: ignore
          retention-days: 30
