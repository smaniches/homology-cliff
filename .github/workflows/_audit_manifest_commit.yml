name: audit-manifest-commit-temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'audit/evidence-integrity-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          lfs: false
          fetch-depth: 0
      - name: Regenerate final manifest
        run: python scripts/update_manifest.py
      - name: Exclude temporary audit helper
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('MANIFEST.sha256.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.pop('.github/workflows/_audit_manifest_commit.yml', None)
          with path.open('w', encoding='utf-8', newline='\n') as handle:
              json.dump(data, handle, indent=1, sort_keys=True)
              handle.write('\n')
          PY
      - name: Verify candidate with repository gate
        run: python scripts/ci/verify_manifest.py
      - name: Commit manifest only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add MANIFEST.sha256.json
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git config user.name "Santiago Maniches"
          git config user.email "santiago@topologica.ai"
          git commit -m "chore(evidence): refresh integrity manifest" \
            -m "Signed-off-by: Santiago Maniches <santiago@topologica.ai>"
          git push origin "HEAD:${HEAD_BRANCH}"
