name: "CONFIRMATORY - locked 10-seed experiment"
run-name: "maintenance - canonical manifest refresh"

on:
  push:
    branches:
      - ci/confirmatory-10seed-action

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/confirmatory-10seed-action
          fetch-depth: 2
          lfs: false

      - name: restore final manual workflow and regenerate canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/confirmatory-10seed.yml > .github/workflows/confirmatory-10seed.yml
          python scripts/update_manifest.py
          python scripts/update_manifest.py --check
          git diff --check
          unexpected="$(git diff --name-only | grep -v -E '^(\.github/workflows/confirmatory-10seed\.yml|MANIFEST\.sha256\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during manifest refresh:"
            echo "$unexpected"
            exit 1
          fi

      - name: commit final workflow and canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/confirmatory-10seed.yml MANIFEST.sha256.json
          git commit -m "Refresh manifest for confirmatory workflow"
          git push origin HEAD:ci/confirmatory-10seed-action
