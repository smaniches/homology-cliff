name: "archive-10seed-result-temp"

on:
  push:
    branches:
      - archive/10seed-confirmatory-result

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          lfs: false

      - name: recover exact sealed confirmatory artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9507564585/zip" > /tmp/confirmatory.zip
          echo "2fabd8d59263c03ee37da2491e8ff1490a0fb343ddca94ffd42aecf7c54cf4bc  /tmp/confirmatory.zip" | sha256sum -c -
          rm -rf /tmp/confirmatory
          mkdir -p /tmp/confirmatory
          unzip -q /tmp/confirmatory.zip -d /tmp/confirmatory
          result=/tmp/confirmatory/cross_family_partition_10seed.json
          test -s "$result"
          echo "332b939622ac2a174124f5378d74d2df074d66561654c7b84e55002608677b7d  $result" | sha256sum -c -
          test "$(tr -d '\r\n' < /tmp/confirmatory/source_commit.txt)" = "b266f2510995bce18c61a7f731fa44b566d28018"
          python - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path('/tmp/confirmatory/runtime.json').read_text())
          assert str(runtime['workflow_run_id']) == '32692013434', runtime
          assert runtime['source_commit'] == 'b266f2510995bce18c61a7f731fa44b566d28018', runtime
          PY
          test ! -e data/results_summaries/cross_family_partition_10seed.json
          cp "$result" data/results_summaries/cross_family_partition_10seed.json

      - name: regenerate canonical manifest for final tree
        shell: bash
        run: |
          set -euo pipefail
          git add data/results_summaries/cross_family_partition_10seed.json
          python scripts/update_manifest.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('MANIFEST.sha256.json')
          manifest = json.loads(manifest_path.read_text())
          temp = '.github/workflows/archive-10seed-result-temp.yml'
          if manifest.pop(temp, None) is None:
              raise SystemExit(f'temporary workflow missing from regenerated manifest: {temp}')

          result_path = Path('data/results_summaries/cross_family_partition_10seed.json')
          data = result_path.read_bytes()
          expected_sha = '332b939622ac2a174124f5378d74d2df074d66561654c7b84e55002608677b7d'
          if hashlib.sha256(data).hexdigest() != expected_sha or len(data) != 242157:
              raise SystemExit('sealed result bytes changed during archival')
          entry = manifest.get(result_path.as_posix())
          if entry != {'bytes': 242157, 'sha256': expected_sha}:
              raise SystemExit(f'unexpected manifest entry for sealed result: {entry!r}')

          with manifest_path.open('w', newline='\n') as fh:
              json.dump(manifest, fh, indent=1, sort_keys=True)
              fh.write('\n')
          PY
          python scripts/ci/verify_manifest.py
          python scripts/ci/verify_prereg_locks.py
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -v -E '^(MANIFEST\.sha256\.json|data/results_summaries/cross_family_partition_10seed\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected working-tree changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: commit exact result and manifest only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results_summaries/cross_family_partition_10seed.json MANIFEST.sha256.json
          git commit -m "Archive locked 10-seed confirmatory result"
          git push origin HEAD:archive/10seed-confirmatory-result
