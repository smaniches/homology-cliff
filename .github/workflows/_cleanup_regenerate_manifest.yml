name: cleanup-regenerate-manifest

on:
  push:
    branches: [cleanup/zero-known-tech-debt-20260818]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'cleanup/zero-known-tech-debt-20260818')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/zero-known-tech-debt-20260818
          lfs: false
          fetch-depth: 0

      - name: apply documentation reconciliation
        shell: python
        run: |
          from pathlib import Path

          problems = Path('PROBLEMS.md')
          text = problems.read_text(encoding='utf-8')
          replacements = {
              '- Zenodo deposit with DOI\n': '- ~~Zenodo deposit with DOI~~ — COMPLETED v1.5.3 (DOI `10.5281/zenodo.20143142`; see `CITATION.cff`).\n',
              '- Independent third-party timestamp anchor (e.g., OpenTimestamps proof on Bitcoin) on the four pre-registration files.': '- Independent third-party timestamp anchor (e.g., OpenTimestamps proof on Bitcoin) on the published pre-registration set and the forward-looking cross-family 10-seed registration.',
              '5. ~~Cross-family (Pfam-partitioned) analysis~~ — COMPLETED v1.0.1.': '5. **Cross-family 10-seed panel-composition robustness extension** — protocol SHA256-locked before any additional panel seed was run. An import-safe executable runner and deterministic unit tests are now present, but the confirmatory ten-seed experiment remains intentionally unexecuted. Its eventual result is a new artifact and does not modify the existing single-seed result.\n6. ~~Cross-family (Pfam-partitioned) analysis~~ — COMPLETED v1.0.1.',
              '6. ~~**Mapper augmentation under full node membership**': '7. ~~**Mapper augmentation under full node membership**',
              'This compendium has six pre-registered experiments, four committed pre-registrations (two SHA256-locked and verified by the harness at runtime and by CI; cascade and Fisher committed without a runtime hash check), 9,360 per-cell bootstrap-CI results,': 'This compendium contains the published pre-registrations plus the forward-looking cross-family 10-seed confirmation. Two published registrations are SHA256-locked and verified at runtime and by CI; cascade and Fisher are committed without a runtime hash check; the forward-looking 10-seed registration is SHA256-locked by CI only. It has 9,360 per-cell bootstrap-CI results,'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'PROBLEMS.md replacement anchor missing: {old!r}')
              text = text.replace(old, new, 1)
          problems.write_text(text, encoding='utf-8', newline='\n')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '### Added\n'
          addition = ('- **Executable confirmatory cross-family runner** at `code/analyses/run_cross_family_partition_10seed.py`, implementing the already-locked ten-seed protocol without executing it. The runner is import-safe, reproduces seed 20260410 against the committed single-seed detail before continuing, reports the locked per-seed Wilson intervals and unweighted seed-level aggregate, retains full per-accession evaluable histories, withholds the strong claim on any zero-evaluable seed, and refuses to write a result if the existing seed does not reproduce. `tests/test_cross_family_partition_10seed.py` covers only deterministic summary, interval, accession-history, and decision-rule logic; no additional panel seed is run by CI or by this change.\n')
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('CHANGELOG.md Added anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          changelog.write_text(text, encoding='utf-8', newline='\n')

      - name: remove one-shot workflow and regenerate manifest
        run: |
          git rm .github/workflows/_cleanup_regenerate_manifest.yml
          python scripts/update_manifest.py

      - name: commit finalized cleanup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: reconcile docs and regenerate manifest'
          git push origin HEAD:cleanup/zero-known-tech-debt-20260818
