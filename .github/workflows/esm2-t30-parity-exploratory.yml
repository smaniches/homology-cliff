name: Exploratory ESM2 t30 parity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/esm2_t30_parity_20261101/run_parity.py
      - .github/workflows/esm2-t30-parity-exploratory.yml

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify Python runtime and source data
        shell: bash
        run: |
          python --version
          git lfs pull --include="data/sequences/proteins_25k_sequences.json,data/embeddings/embeddings_t30.npy" --exclude=""
          printf '%s  %s\n' \
            c99d8329c02b806b9d208465946c68826d17245cd9e012ca9a7b94faea0a60fc data/sequences/proteins_25k_sequences.json \
            15d6e3656b46729a2483b7fbc603e49a61f25206e3854676bc2e528164608fd6 data/embeddings/embeddings_t30.npy \
            | sha256sum --check --strict
          python - <<'PY'
          import json
          with open('data/sequences/proteins_25k_sequences.json', encoding='utf-8') as f:
              document = json.load(f)
          print('dataset_type:', type(document).__name__)
          print('dataset_keys:', sorted(document) if isinstance(document, dict) else '(not dict)')
          rows = document['test_set']
          print('test_set_rows:', len(rows))
          assert len(rows) == 24885
          assert isinstance(rows[0]['sequence'], str)
          PY
      - name: Install Python 3.11 binary wheels
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --only-binary=:all: 'numpy==2.1.3' 'transformers==4.46.3' 'huggingface-hub==0.36.0' 'safetensors==0.4.5'
          python -m pip check
          python - <<'PY'
          import torch, numpy, transformers, huggingface_hub, safetensors
          print({'torch': torch.__version__, 'numpy': numpy.__version__, 'transformers': transformers.__version__, 'huggingface_hub': huggingface_hub.__version__, 'safetensors': safetensors.__version__})
          assert not torch.cuda.is_available(), 'This workflow is the CPU reference path'
          PY
      - name: Run real-model parity (CPU reference)
        run: python -u experiments/esm2_t30_parity_20261101/run_parity.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: esm2-t30-parity-evidence
          path: parity_result.json
          if-no-files-found: ignore
          retention-days: 30
