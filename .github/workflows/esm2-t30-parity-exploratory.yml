name: Exploratory ESM2 t30 parity (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Verify data objects
        shell: bash
        run: |
          git lfs pull --include="data/sequences/proteins_25k_sequences.json,data/embeddings/embeddings_t30.npy" --exclude=""
          sha256sum data/sequences/proteins_25k_sequences.json data/embeddings/embeddings_t30.npy
      - name: Install runtime
        run: |
          python -m pip install "numpy==2.1.3" "torch==2.5.1" "transformers==4.46.3" "huggingface-hub==0.36.0" "safetensors==0.4.5"
      - name: Run real-model parity (CPU)
        run: python experiments/esm2_t30_parity_20261101/run_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esm2-t30-parity-evidence
          path: parity_result.json
          if-no-files-found: ignore
          retention-days: 30
