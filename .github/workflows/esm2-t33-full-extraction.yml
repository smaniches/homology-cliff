name: Exploratory ESM-2 t33 full extraction

on:
  pull_request:
    paths:
      - .github/workflows/esm2-t33-full-extraction.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install fixed NumPy wheel
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.1.3'
      - name: Check exact shard and assembly contracts
        run: python -m unittest discover -s experiments/esm2_t33_full_20261102 -p 'test_*.py' -v

  extract:
    # Full extraction is opt-in; PR validation is handled by shard-gate.
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download original frozen sequences, no other LFS objects
        shell: bash
        run: |
          git lfs pull --include="data/sequences/proteins_25k_sequences.json" --exclude=""
          printf '%s  %s\n' \
            c99d8329c02b806b9d208465946c68826d17245cd9e012ca9a7b94faea0a60fc \
            data/sequences/proteins_25k_sequences.json | sha256sum --check --strict
      - name: Install exact CPU inference runtime
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --only-binary=:all: 'numpy==2.1.3' 'transformers==4.46.3' 'huggingface-hub==0.36.0' 'safetensors==0.4.5'
          python -m pip check
      - name: Download original six-vector pilot artifact
        uses: actions/download-artifact@v6
        with:
          name: esm2-t33-pilot-evidence
          repository: smaniches/homology-cliff
          run-id: 41405031973
          github-token: ${{ github.token }}
          path: pilot-reference
      - name: Verify frozen pilot SHA-256 before inference
        run: |
          printf '%s  %s\n' \
            2074ee00b89619abe5cafaa0877207c87e717636e185700a6c5e30791ed6b5d0 \
            pilot-reference/pilot_embedding.npy | sha256sum --check --strict
      - name: Extract assigned full-data shard with atomic block checkpoints
        env:
          SHARD_ID: ${{ matrix.shard }}
        run: |
          python -u experiments/esm2_t33_full_20261102/run_full_extraction.py shard \
            --rank "$SHARD_ID" --shards 8 --block-size 128 --outdir shard-output \
            --anchor-reference pilot-reference/pilot_embedding.npy
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: t33-full-shard-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: ignore
          retention-days: 30

  assemble:
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install fixed NumPy wheel
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.1.3'
      - uses: actions/download-artifact@v6
        with:
          pattern: t33-full-shard-*
          path: downloaded-shards
          merge-multiple: false
      - name: Assemble all 24885 rows or fail on incomplete provenance
        run: |
          python -u experiments/esm2_t33_full_20261102/run_full_extraction.py assemble \
            --inputs downloaded-shards --outdir final-evidence
      - uses: actions/upload-artifact@v6
        with:
          name: t33-full-array-and-manifest
          path: final-evidence/
          retention-days: 30
