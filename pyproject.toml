# This repository is a research compendium, not an importable Python library.
# The code under code/ runs as standalone scripts (e.g. `python code/harnesses/run_cliff.py`,
# `python code/analyses/v3_aggregate.py`) that resolve their data paths relative to the
# on-disk repository root and import sibling scripts via sys.path; see README.md and
# REVIEWER.md for the canonical usage. No package is shipped to site-packages.
#
# This pyproject exists only to (1) carry project metadata and (2) make
# `pip install -e .` a convenient way to install the runtime dependencies. The
# `[tool.setuptools] py-modules = []` line below disables setuptools' flat-layout
# auto-discovery, which would otherwise fail because code/, data/, papers/, etc. are
# all top-level directories.

[build-system]
# setuptools>=64 provides the PEP 660 build_editable hook that `pip install -e .`
# requires; >=77 additionally understands the PEP 639 SPDX `license` expression
# and `license-files` used below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homology-cliff"
version = "1.5.1"
description = "Homology cliff in frozen protein language models: characterization, pre-registered nulls, and a deployable rescue"
authors = [{name = "Santiago Maniches", email = "santiago@topologica.llc"}]
readme = "README.md"
# PEP 639 SPDX expression: code is MIT, papers/figures are CC-BY-4.0.
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE-code.txt", "LICENSE-papers.txt"]
requires-python = ">=3.11"
keywords = [
    "protein language models",
    "ESM-2",
    "biosecurity",
    "pre-registered research",
    "retrieval",
    "homology detection",
    "calibration",
    "topological data analysis",
    "Mapper",
    "reproducibility",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "faiss-cpu>=1.7.4", "torch>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov"]
paper = ["biopython"]
# Lint / type / security toolchain used by the CI quality gates. Exact,
# CI-validated pins live in requirements-lock.txt (the verification-toolchain
# lock); these floors keep `pip install -e .[dev]` usable for contributors.
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov",
    "coverage>=7.5",
]

[project.urls]
Homepage = "https://github.com/smaniches/homology-cliff"
Repository = "https://github.com/smaniches/homology-cliff"
Documentation = "https://smaniches.github.io/homology-cliff/"
Changelog = "https://github.com/smaniches/homology-cliff/blob/main/CHANGELOG.md"

[tool.setuptools]
# No importable package is shipped; see the header comment above. Both
# packages and py-modules are pinned empty so setuptools' flat-layout
# auto-discovery never treats code/, data/, papers/, etc. as importable.
packages = []
py-modules = []

# ---------------------------------------------------------------------------
# Quality gates (run by .github/workflows/lint.yml and tests.yml).
#
# Scope rationale: the harness/analysis scripts under code/ are
# pre-registration / DOI-locked artifact code. This PR adds verification
# without reformatting them, so style-only rules are omitted, a few pre-existing
# findings are explicitly accepted (ruff per-file-ignores + a bandit baseline),
# and --strict typing is scoped to the already-annotated verifier surface.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
# Kaggle/Colab notebook cells are fragments of one interactive session (each
# cell uses names bound by an earlier cell), so linting them as standalone
# modules trips F821 on every reference -- category-inappropriate. Excluded.
extend-exclude = ["code/kaggle_notebooks", "code/colab_notebook"]

[tool.ruff.lint]
# Correctness rules only: pyflakes (F) + syntax/runtime errors (E9). Stylistic
# compound-statement rules (E701/E702) are intentionally omitted: the locked
# scripts use compact one-line guards by design and are not reformatted here.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# DOI-locked artifact scripts: pre-existing unused-import/name/f-string flags
# are accepted rather than edited, so this PR changes no published-result code.
# Tracked for a future provenance-safe cleanup pass.
"code/harnesses/*.py" = ["F401"]
"code/analyses/*.py" = ["F401", "F841", "F541"]
"deployment_example/*.py" = ["F841"]

[tool.mypy]
python_version = "3.11"
# --strict is enforced (in CI) only on the fully-annotated verification surface
# under scripts/ci/. The numpy-heavy research harnesses are intentionally
# untyped; bringing them to --strict is tracked separately, not in scope here.
strict = true
files = ["scripts/ci"]

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "torch", "torch.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.bandit]
# bandit is invoked in CI over explicit targets (code/harnesses code/analyses
# scripts deployment_example); notebook cells and tests are out of scope by not
# being scanned. The skipped checks below are intentional, reviewed patterns in
# this research/tooling code, not defects. Skips are path- and line-agnostic, so
# they are robust across the Windows dev box and the Linux CI runner (unlike a
# committed baseline file, whose paths/line-numbers differ by platform):
#   B101 assert_used         -- data-validation asserts in the harness (run_cliff)
#   B310 urlopen             -- one hardcoded-https UniProt fetch, no user input
#   B311 random              -- seeded stdlib random for reproducible bootstrap CIs
#   B404/B603/B607 subprocess-- fixed-arg `git` calls in scripts/update_manifest.py
# All other checks (shell injection, eval, hardcoded secrets, yaml.load, ...)
# remain active and fail CI on any new finding.
skips = ["B101", "B310", "B311", "B404", "B603", "B607"]

[tool.coverage.run]
branch = true
# CI runs WITHOUT the Git-LFS payload and WITHOUT faiss/torch, so coverage
# reflects only the LFS-free, dependency-light surface CI can execute: the pure
# numerical functions exercised by the known-answer tests plus the verifiers.
# This is deliberately NOT a whole-repo coverage claim -- see the PR description.
source = ["scripts/ci", "code/harnesses", "code/analyses"]

[tool.coverage.report]
show_missing = true
# Honest floor, NOT a ceiling. Measured ~17% over the FULL numerical+verifier
# surface (denominator is not cherry-picked). It is low by construction: the
# per-cell harness paths and analysis orchestration require the LFS data payload
# plus faiss/torch (absent in CI), and the standalone verifier scripts
# (verify_evidence/prereg_locks/smoke_imports) are exercised by their own
# workflows rather than under pytest. What IS unit-covered is the published-
# number logic: F1/ECE/stratify/bootstrap/panel/vote and the manifest verifier.
# This gate only guards against regression below the current floor.
fail_under = 15
