# This repository is a research compendium, not an importable Python library.
# The code under code/ runs as standalone scripts (e.g. `python code/harnesses/run_cliff.py`,
# `python code/analyses/v3_aggregate.py`) that resolve their data paths relative to the
# on-disk repository root and import sibling scripts via sys.path; see README.md and
# REVIEWER.md for the canonical usage. No package is shipped to site-packages.
#
# This pyproject exists only to (1) carry project metadata and (2) make
# `pip install -e .` a convenient way to install the runtime dependencies. The
# `[tool.setuptools] py-modules = []` line below disables setuptools' flat-layout
# auto-discovery, which would otherwise fail because code/, data/, papers/, etc. are
# all top-level directories.

[build-system]
# setuptools>=64 provides the PEP 660 build_editable hook that `pip install -e .`
# requires; 61-63 satisfy the spec but lack that backend hook.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "homology-cliff"
version = "1.4.7"
description = "Homology cliff in frozen protein language models: characterization, pre-registered nulls, and a deployable rescue"
authors = [{name = "Santiago Maniches", email = "santiago@topologica.llc"}]
readme = "README.md"
license = {text = "MIT AND CC-BY-4.0"}
requires-python = ">=3.11"
keywords = [
    "protein language models",
    "ESM-2",
    "biosecurity",
    "pre-registered research",
    "retrieval",
    "homology detection",
    "calibration",
    "topological data analysis",
    "Mapper",
    "reproducibility",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "faiss-cpu>=1.7.4", "torch>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov"]
paper = ["biopython"]

[project.urls]
Homepage = "https://github.com/smaniches/homology-cliff"
Repository = "https://github.com/smaniches/homology-cliff"
Documentation = "https://smaniches.github.io/homology-cliff/"
Changelog = "https://github.com/smaniches/homology-cliff/blob/main/CHANGELOG.md"

[tool.setuptools]
# No importable package is shipped; see the header comment above. Both
# packages and py-modules are pinned empty so setuptools' flat-layout
# auto-discovery never treats code/, data/, papers/, etc. as importable.
packages = []
py-modules = []
